name: Temporary v1.19.4 figure export
on:
  push:
    branches:
      - chatgpt-v1194-transport
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package exact v1.19.4 figures
        uses: actions/upload-artifact@v4
        with:
          name: v1194-exact-figures
          path: transport/v1194/png/*.png
          if-no-files-found: error
          retention-days: 1
