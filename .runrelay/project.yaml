schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  run_garnett_dream_e5_transfer:
    description: Run the single frozen ChineseEEG-to-Garnett-Dream multilingual-E5 same-participant/new-text validation, comparing lambda 0.10 neural-guided against lambda 0 text-only on the prospectively frozen row_mean_all EEG target with the exact segmented-XLSX text mapping and full restored nuisance family. The launcher only normalizes the completed reliability artifact schema before executing the frozen analysis.
    command:
      - .venv/bin/python
      - scripts/tuning/run_garnett_dream_e5_transfer_v1_compat.py
      - --data-root
      - data/raw/chineseeeg
      - --input-freeze
      - outputs/garnett_dream_input_materialization/latest/summary.json
      - --session-inventory
      - outputs/garnett_dream_input_materialization/latest/session_inventory.csv
      - --item-identity
      - outputs/garnett_dream_input_materialization/latest/item_identity.csv
      - --reliability-summary
      - outputs/garnett_dream_primary_reliability/latest/summary.json
      - --mapping-freeze
      - outputs/garnett_dream_segmented_xlsx_mapping_probe_v1/latest/summary.json
      - --output-dir
      - outputs/garnett_dream_e5_transfer_v1/latest
      - --device
      - auto
    approval: manual
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/garnett_dream_e5_transfer_v1/latest/summary.json
      - outputs/garnett_dream_e5_transfer_v1/latest/subject_results.csv
      - outputs/garnett_dream_e5_transfer_v1/latest/chapter_results.csv

  probe_ahba_chineseeeg_preflight_v1:
    description: Run a model-blind AHBA/ChineseEEG spatial-mapping preflight that inventories software, 128-channel spatial metadata, and standard-montage overlap without opening EEG samples or computing NeuroSem/model/molecular outcomes.
    command:
      - .venv/bin/python
      - scripts/audit/probe_ahba_chineseeeg_preflight_v1.py
      - --data-root
      - data/raw/chineseeeg
      - --output-dir
      - outputs/ahba_chineseeeg_preflight_v1/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_chineseeeg_preflight_v1/latest/summary.json
      - outputs/ahba_chineseeeg_preflight_v1/latest/spatial_metadata_inventory.csv
      - outputs/ahba_chineseeeg_preflight_v1/latest/montage_overlap.csv

  setup_ahba_dependencies_v1:
    description: Install and verify the pinned abagen 0.1.3 AHBA preprocessing dependency in the project virtual environment. No AHBA data, EEG samples, model quantities, or NeuroSem outcomes are accessed.
    command:
      - .venv/bin/python
      - scripts/setup/setup_ahba_dependencies_v1.py
      - --output-dir
      - outputs/ahba_dependency_setup_v1/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_dependency_setup_v1/latest/summary.json

  probe_ahba_forward_model_feasibility_v1:
    description: Run a model-blind feasibility audit for registering the measured 128-channel ChineseEEG CapTrak geometry to a template-MRI EEG forward model. No EEG signal samples, AHBA downloads, model quantities, NeuroSem outcomes, or gene-expression outcomes are accessed.
    command:
      - .venv/bin/python
      - scripts/audit/probe_ahba_forward_model_feasibility_v1.py
      - --preflight-summary
      - outputs/ahba_chineseeeg_preflight_v1/latest/summary.json
      - --spatial-inventory
      - outputs/ahba_chineseeeg_preflight_v1/latest/spatial_metadata_inventory.csv
      - --output-dir
      - outputs/ahba_forward_model_feasibility_v1/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_forward_model_feasibility_v1/latest/summary.json

  freeze_ahba_registration_source_model_v1:
    description: Model-blind freeze audit for the measured ChineseEEG-to-fsaverage registration inputs and the AHBA EEG source-model conventions. It may materialize public fsaverage anatomy but never opens EEG signal samples, downloads AHBA, or computes NeuroSem/model/gene-expression outcomes.
    command:
      - .venv/bin/python
      - scripts/audit/freeze_ahba_registration_source_model_v1.py
      - --data-root
      - data/raw/chineseeeg
      - --feasibility-summary
      - outputs/ahba_forward_model_feasibility_v1/latest/summary.json
      - --output-dir
      - outputs/ahba_registration_source_model_freeze_v1/latest
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_registration_source_model_freeze_v1/latest/summary.json

  freeze_ahba_registration_transform_v1:
    description: Construct and model-blindly validate the explicit rigid measured-head-to-fsaverage transform using the frozen 128-channel CapTrak geometry and NAS/LPA/RPA fiducials. Freeze it only if prespecified sensor-to-scalp distance checks pass. No EEG samples, AHBA data, model quantities, or NeuroSem outcomes are accessed.
    command:
      - .venv/bin/python
      - scripts/audit/freeze_ahba_registration_transform_v1.py
      - --data-root
      - data/raw/chineseeeg
      - --source-freeze
      - outputs/ahba_registration_source_model_freeze_v1/latest/summary.json
      - --output-dir
      - outputs/ahba_registration_transform_freeze_v1/latest
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_registration_transform_freeze_v1/latest/summary.json
      - outputs/ahba_registration_transform_freeze_v1/latest/alignment_diagnostic.png
      - outputs/ahba_registration_transform_freeze_v1/latest/chineseeeg-head-fsaverage-trans.fif

  prepare_ahba_expression_dk_v1:
    description: Prepare model-blind donor-level AHBA expression on the fsaverage5 Desikan-Killiany cortical atlas using frozen abagen settings, with left-to-right mirroring as primary and no-mirror as a prespecified sensitivity. The launcher restores only legacy pandas call signatures required by abagen 0.1.3. No EEG samples, model quantities, NeuroSem outcomes, or gene-set association tests are accessed.
    command:
      - .venv/bin/python
      - scripts/analysis/run_ahba_expression_dk_v1_compat.py
      - --transform-freeze
      - outputs/ahba_registration_transform_freeze_v1/latest/summary.json
      - --data-dir
      - data/raw/ahba
      - --output-dir
      - outputs/ahba_expression_dk_v1/latest
    approval: manual
    timeout_minutes: 360
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_expression_dk_v1/latest/summary.json
      - outputs/ahba_expression_dk_v1/latest/abagen_primary_methods.txt
      - outputs/ahba_expression_dk_v1/latest/abagen_sensitivity_methods.txt

  freeze_ahba_forward_sensitivity_v1:
    description: Compute and freeze the model-blind 128-channel by cortical-vertex EEG forward-sensitivity matrix from the exact dataset-provided CapTrak geometry, frozen explicit head-to-fsaverage transform, fsaverage ico-5 source space, and 3-layer BEM. Apply the frozen average-reference, fixed surface-normal, absolute lead-field, and per-channel L1 normalization conventions. No EEG signal samples, AHBA expression, NeuroSem/model outcomes, or gene-set tests are accessed.
    command:
      - .venv/bin/python
      - scripts/audit/freeze_ahba_forward_sensitivity_v1.py
      - --data-root
      - data/raw/chineseeeg
      - --source-freeze
      - outputs/ahba_registration_source_model_freeze_v1/latest/summary.json
      - --transform-freeze
      - outputs/ahba_registration_transform_freeze_v1/latest/summary.json
      - --output-dir
      - outputs/ahba_forward_sensitivity_v1/latest
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_forward_sensitivity_v1/latest/summary.json
      - outputs/ahba_forward_sensitivity_v1/latest/channel_sensitivity_qc.csv
      - outputs/ahba_forward_sensitivity_v1/latest/forward_sensitivity.npz

  freeze_ahba_dk_ico5_mapping_v1:
    description: Freeze the model-blind mapping from the 68 cortical Desikan-Killiany aparc parcels to the exact fsaverage ico-5 source vertices used by the frozen EEG forward-sensitivity matrix. Quantify unknown/corpus-callosum territory explicitly and fail closed on ambiguous parcel-name reconciliation. Do not load EEG signal samples, AHBA gene-expression values, NeuroSem/model outcomes, or biological gene-set results.
    command:
      - .venv/bin/python
      - scripts/audit/freeze_ahba_dk_ico5_mapping_v1.py
      - --source-freeze
      - outputs/ahba_registration_source_model_freeze_v1/latest/summary.json
      - --forward-freeze
      - outputs/ahba_forward_sensitivity_v1/latest/summary.json
      - --forward-matrix
      - outputs/ahba_forward_sensitivity_v1/latest/forward_sensitivity.npz
      - --expression-summary
      - outputs/ahba_expression_dk_v1/latest/summary.json
      - --atlas-info
      - outputs/ahba_expression_dk_v1/latest/primary_leftright/atlas_info.csv
      - --output-dir
      - outputs/ahba_dk_ico5_mapping_v1/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_dk_ico5_mapping_v1/latest/summary.json
      - outputs/ahba_dk_ico5_mapping_v1/latest/vertex_parcel_map.csv
      - outputs/ahba_dk_ico5_mapping_v1/latest/parcel_coverage.csv

  build_ahba_molecular_sensitivity_matrix_v1:
    description: Build model-blind population and leave-one-donor-out 128 x G AHBA molecular-sensitivity matrices from frozen inputs. Preserve donor-parcel missingness without imputation, reconstruct the frozen abagen donors/mean parcel aggregation from available donor values, renormalize sensitivity within the DK-mapped domain, spatially z-score each complete aggregated gene map, and project. Generate LODO matrices only when all 68 parcels remain observed after donor exclusion. No biological gene-set or NeuroSem outcomes are accessed.
    command:
      - .venv/bin/python
      - scripts/analysis/build_ahba_molecular_sensitivity_matrix_v1.py
      - --forward-freeze
      - outputs/ahba_forward_sensitivity_v1/latest/summary.json
      - --forward-matrix
      - outputs/ahba_forward_sensitivity_v1/latest/forward_sensitivity.npz
      - --mapping-freeze
      - outputs/ahba_dk_ico5_mapping_v1/latest/summary.json
      - --vertex-map
      - outputs/ahba_dk_ico5_mapping_v1/latest/vertex_parcel_map.csv
      - --expression-summary
      - outputs/ahba_expression_dk_v1/latest/summary.json
      - --expression-root
      - outputs/ahba_expression_dk_v1/latest
      - --output-dir
      - outputs/ahba_molecular_sensitivity_matrix_v1/latest
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_molecular_sensitivity_matrix_v1/latest/summary.json
      - outputs/ahba_molecular_sensitivity_matrix_v1/latest/projection_qc.csv

  freeze_ahba_biological_gene_sets_v1:
    description: Freeze the prespecified AHBA biological gene-set panel before any NeuroSem molecular outcome test. Validate curated GABAergic, serotonergic, and compact published human-brain cell-type marker panels against the frozen AHBA gene universes, and freeze exact memberships for two prespecified Reactome pathways with database version and response hashes. No EEG samples, molecular-sensitivity values, NeuroSem/model outcomes, or gene-set associations are accessed.
    command:
      - .venv/bin/python
      - scripts/analysis/freeze_ahba_biological_gene_sets_v1.py
      - --expression-root
      - outputs/ahba_expression_dk_v1/latest
      - --matrix-summary
      - outputs/ahba_molecular_sensitivity_matrix_v1/latest/summary.json
      - --output-dir
      - outputs/ahba_biological_gene_sets_v1/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_biological_gene_sets_v1/latest/summary.json
      - outputs/ahba_biological_gene_sets_v1/latest/gene_sets.json
      - outputs/ahba_biological_gene_sets_v1/latest/gene_set_membership.csv
      - outputs/ahba_biological_gene_sets_v1/latest/references.md

  freeze_chineseeeg_semantic_channel_target_v1:
    description: Freeze an AHBA-blind 128-channel contribution target for the established ChineseEEG semantic RSA. On held-out Little Prince runs 01-06, compute full residual partial-Spearman RSA to the pinned bert-base-chinese final-layer semantic target and the drop caused by leaving out each channel, then average channel contributions across runs within subjects and across common subjects. This task never loads AHBA expression, molecular-sensitivity values, biological gene sets, or molecular-association results.
    command:
      - .venv/bin/python
      - scripts/analysis/freeze_chineseeeg_semantic_channel_target_v1.py
      - --runs
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - --feature-root
      - outputs/chineseeeg_row_features
      - --embedding-root
      - outputs/chineseeeg_pinned_embeddings
      - --output-dir
      - outputs/chineseeeg_semantic_channel_target_v1/latest
    approval: manual
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/chineseeeg_semantic_channel_target_v1/latest/summary.json
      - outputs/chineseeeg_semantic_channel_target_v1/latest/population_channel_target.csv
      - outputs/chineseeeg_semantic_channel_target_v1/latest/participant_channel_target.csv
      - outputs/chineseeeg_semantic_channel_target_v1/latest/run_subject_channel_contributions.csv

  run_ahba_frozen_gene_set_association_v1:
    description: Run the first outcome-bearing frozen NeuroSem-AHBA gene-set association. Use the prospectively frozen 9-participant ChineseEEG semantic channel target, frozen AHBA molecular-sensitivity matrices, and frozen biological gene sets. The seven neurochemical/pathway sets are the primary mechanistic family and seven broad cell-type panels are a separate specificity-control family. Primary inference is participant-level two-sided exact sign-flip on Fisher-z transformed 128-channel Spearman associations, with BH-FDR within each family. Also compute six-donor LODO robustness, the no-mirror bilateral sensitivity, and 5000 size-matched random-gene-set nulls per set. Spatial-autocorrelation and broad cortical-gradient controls remain required before any mechanistic claim.
    command:
      - .venv/bin/python
      - scripts/analysis/run_ahba_frozen_gene_set_association_v1.py
      - --matrix-root
      - outputs/ahba_molecular_sensitivity_matrix_v1/latest
      - --matrix-summary
      - outputs/ahba_molecular_sensitivity_matrix_v1/latest/summary.json
      - --gene-set-summary
      - outputs/ahba_biological_gene_sets_v1/latest/summary.json
      - --gene-sets
      - outputs/ahba_biological_gene_sets_v1/latest/gene_sets.json
      - --channel-target-summary
      - outputs/chineseeeg_semantic_channel_target_v1/latest/summary.json
      - --participant-target
      - outputs/chineseeeg_semantic_channel_target_v1/latest/participant_channel_target.csv
      - --random-sets
      - '5000'
      - --seed
      - '20260827'
      - --output-dir
      - outputs/ahba_frozen_gene_set_association_v1/latest
    approval: manual
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_frozen_gene_set_association_v1/latest/summary.json
      - outputs/ahba_frozen_gene_set_association_v1/latest/set_results.csv
      - outputs/ahba_frozen_gene_set_association_v1/latest/participant_results.csv
      - outputs/ahba_frozen_gene_set_association_v1/latest/donor_and_bilateral_sensitivity.csv
      - outputs/ahba_frozen_gene_set_association_v1/latest/size_matched_random_set_nulls.csv

  freeze_chineseeeg_semantic_parcel_target_v1:
    description: Freeze an AHBA-blind 68-parcel cortical semantic-contribution phenotype by deterministic sensitivity-weighted back-projection of the already-frozen 128-channel ChineseEEG semantic contribution maps through the frozen EEG forward-sensitivity matrix and DK68 vertex mapping. No AHBA expression, gene sets, transcriptomic outcomes, inverse fitting, or regularization/tuning are used.
    command:
      - .venv/bin/python
      - scripts/analysis/freeze_chineseeeg_semantic_parcel_target_v1.py
      - --channel-target-summary
      - outputs/chineseeeg_semantic_channel_target_v1/latest/summary.json
      - --participant-target
      - outputs/chineseeeg_semantic_channel_target_v1/latest/participant_channel_target.csv
      - --forward-summary
      - outputs/ahba_forward_sensitivity_v1/latest/summary.json
      - --forward-matrix
      - outputs/ahba_forward_sensitivity_v1/latest/forward_sensitivity.npz
      - --mapping-summary
      - outputs/ahba_dk_ico5_mapping_v1/latest/summary.json
      - --vertex-map
      - outputs/ahba_dk_ico5_mapping_v1/latest/vertex_parcel_map.csv
      - --output-dir
      - outputs/chineseeeg_semantic_parcel_target_v1/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/summary.json
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/population_parcel_target.csv
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/participant_parcel_target.csv
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/channel_parcel_sensitivity.csv

  run_ahba_exploratory_transcriptome_v1:
    description: Run a new exploratory imaging-transcriptomics phase using the frozen AHBA-blind DK68 semantic phenotype and frozen primary mirrored AHBA expression. Compute whole-transcriptome PLS1 gene weights, intrinsic transcriptomic gradients, six-donor LODO weight stability, and 5000 hemisphere-constrained spherical-rotation nulls. This remains separate from the prior frozen GABA/serotonin null. Published language-gene panels are not tested here and will be frozen independently before validation.
    command:
      - .venv/bin/python
      - scripts/analysis/run_ahba_exploratory_transcriptome_v1.py
      - --parcel-summary
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/summary.json
      - --parcel-target
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/population_parcel_target.csv
      - --expression-summary
      - outputs/ahba_expression_dk_v1/latest/summary.json
      - --expression-root
      - outputs/ahba_expression_dk_v1/latest
      - --source-freeze
      - outputs/ahba_registration_source_model_freeze_v1/latest/summary.json
      - --vertex-map
      - outputs/ahba_dk_ico5_mapping_v1/latest/vertex_parcel_map.csv
      - --spins
      - '5000'
      - --seed
      - '20260827'
      - --output-dir
      - outputs/ahba_exploratory_transcriptome_v1/latest
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_exploratory_transcriptome_v1/latest/summary.json
      - outputs/ahba_exploratory_transcriptome_v1/latest/gene_weights.csv
      - outputs/ahba_exploratory_transcriptome_v1/latest/gradient_results.csv
      - outputs/ahba_exploratory_transcriptome_v1/latest/donor_lodo_weight_stability.csv
      - outputs/ahba_exploratory_transcriptome_v1/latest/spin_null_summary.csv

  freeze_published_language_gene_panel_v1:
    description: Outcome-blind freeze of an independent published human language-cortex gene panel from Wong et al. PNAS 2024 Dataset S5. Retrieve and hash the supplementary table, extract exactly the published 56 genes defined by region-specific laminar expression plus layer II/III and/or V/VI excitatory corticocortical-neuron upregulation, and validate overlap with the frozen primary AHBA gene universe. Do not load NeuroSem targets, exploratory PLS results, prior molecular-association results, or model quantities.
    command:
      - .venv/bin/python
      - scripts/analysis/freeze_published_language_gene_panel_v1.py
      - --expression-root
      - outputs/ahba_expression_dk_v1/latest
      - --output-dir
      - outputs/published_language_gene_panel_v1/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/published_language_gene_panel_v1/latest/summary.json
      - outputs/published_language_gene_panel_v1/latest/gene_panel.json
      - outputs/published_language_gene_panel_v1/latest/gene_panel_membership.csv
      - outputs/published_language_gene_panel_v1/latest/references.md

  freeze_published_language_gene_panels_v2:
    description: Outcome-blind freeze of two exact language-related gene panels explicitly listed in Wong et al. PNAS 2024 main article text, namely six genes individually associated with pars triangularis-middle temporal structural connectivity within the published 56-gene language set, and fourteen genes individually associated with dyslexia within that same set. Validate exact memberships against the frozen primary AHBA gene universe without reading any NeuroSem target or prior AHBA outcome.
    command:
      - .venv/bin/python
      - scripts/analysis/freeze_published_language_gene_panels_v2.py
      - --expression-root
      - outputs/ahba_expression_dk_v1/latest
      - --output-dir
      - outputs/published_language_gene_panels_v2/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/published_language_gene_panels_v2/latest/summary.json
      - outputs/published_language_gene_panels_v2/latest/gene_panels.json
      - outputs/published_language_gene_panels_v2/latest/gene_panel_membership.csv
      - outputs/published_language_gene_panels_v2/latest/references.md

  run_ahba_published_language_panel_validation_v1:
    description: Run the frozen independent AHBA validation of the two literature-defined Wong et al. 2024 language-related gene panels against the frozen DK68 ChineseEEG semantic cortical phenotype. Use the mean spatially standardized panel-gene expression map, Spearman association, 5000 hemisphere-constrained spherical rotations, 5000 size-matched random-gene sets, 5000 panel-coexpression-profile-matched random-gene sets, BH-FDR across the two panels, six-donor leave-one-out robustness, and no-mirror bilateral sensitivity. A panel is jointly supported only if both spatial-spin and coexpression-profile BH q values are below 0.05.
    command:
      - .venv/bin/python
      - scripts/analysis/run_ahba_published_language_panel_validation_v1.py
      - --parcel-summary
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/summary.json
      - --parcel-target
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/population_parcel_target.csv
      - --expression-root
      - outputs/ahba_expression_dk_v1/latest
      - --panel-summary
      - outputs/published_language_gene_panels_v2/latest/summary.json
      - --panel-json
      - outputs/published_language_gene_panels_v2/latest/gene_panels.json
      - --source-freeze
      - outputs/ahba_registration_source_model_freeze_v1/latest/summary.json
      - --vertex-map
      - outputs/ahba_dk_ico5_mapping_v1/latest/vertex_parcel_map.csv
      - --spins
      - '5000'
      - --random-sets
      - '5000'
      - --seed
      - '20260827'
      - --output-dir
      - outputs/ahba_published_language_panel_validation_v1/latest
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_published_language_panel_validation_v1/latest/summary.json
      - outputs/ahba_published_language_panel_validation_v1/latest/panel_results.csv
      - outputs/ahba_published_language_panel_validation_v1/latest/donor_lodo_results.csv
      - outputs/ahba_published_language_panel_validation_v1/latest/bilateral_sensitivity.csv

  run_ahba_language_mirroring_diagnostic_v1:
    description: Post-hoc method-sensitivity diagnostic for the published Wong language panels. Explain the stronger no-mirror dyslexia-panel association without redefining the frozen panels or changing the confirmatory conclusion. Compare mirrored full-68 and mirrored/no-mirror results on identical no-mirror common parcel support, decompose by hemisphere, frozen panel gene, parcel, donor coverage, and leave-one-donor-out matched-support robustness.
    command:
      - .venv/bin/python
      - scripts/analysis/run_ahba_language_mirroring_diagnostic_v1.py
      - --expression-root
      - outputs/ahba_expression_dk_v1/latest
      - --panel-json
      - outputs/published_language_gene_panels_v2/latest/gene_panels.json
      - --parcel-target
      - outputs/chineseeeg_semantic_parcel_target_v1/latest/population_parcel_target.csv
      - --output-dir
      - outputs/ahba_language_mirroring_diagnostic_v1/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/ahba_language_mirroring_diagnostic_v1/latest/summary.json
