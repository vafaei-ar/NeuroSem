schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  build_nmi_figure1_redesign_v1:
    description: >-
      Rebuild NeuroSem Figure 1 from frozen ChineseEEG development, participant-level
      reliability and C-MTEB summaries using the final scientific-graphic layout.
      Presentation-only: no model fitting, neural analysis, representation selection,
      target selection or new inference.
    command:
      - .venv/bin/python
      - scripts/paper/build_nmi_figure1_redesign_v1.py
    approval: automatic
    timeout_minutes: 15
    requires_gpu: false
    resources:
      cpu_cores: 2
      min_ram_gb: 4
      wait_minutes: 15
    working_directory: .
    artifacts:
      - outputs/nmi_figure1_redesign_v1/latest/figure1.pdf
      - outputs/nmi_figure1_redesign_v1/latest/figure1.svg
      - outputs/nmi_figure1_redesign_v1/latest/figure1.png
      - outputs/nmi_figure1_redesign_v1/latest/figure1_reliability_source.csv
      - outputs/nmi_figure1_redesign_v1/latest/figure1_development_source.csv
      - outputs/nmi_figure1_redesign_v1/latest/source_manifest.json

  build_nmi_figure2_redesign_v1:
    description: >-
      Rebuild NeuroSem Figure 2 from frozen ZuCo and SMN4Lang participant-level
      reliability/transfer outputs plus completed E5 optimization-seed robustness.
      Presentation-only: no model fitting, model evaluation, neural analysis or new inference.
    command:
      - .venv/bin/python
      - scripts/paper/build_nmi_figure2_redesign_v1.py
    approval: automatic
    timeout_minutes: 15
    requires_gpu: false
    resources:
      cpu_cores: 2
      min_ram_gb: 4
      wait_minutes: 15
    working_directory: .
    artifacts:
      - outputs/nmi_figure2_redesign_v1/latest/figure2.pdf
      - outputs/nmi_figure2_redesign_v1/latest/figure2.svg
      - outputs/nmi_figure2_redesign_v1/latest/figure2.png
      - outputs/nmi_figure2_redesign_v1/latest/figure2_reliability_source.csv
      - outputs/nmi_figure2_redesign_v1/latest/figure2_primary_transfer_source.csv
      - outputs/nmi_figure2_redesign_v1/latest/figure2_seed_robustness_source.csv
      - outputs/nmi_figure2_redesign_v1/latest/source_manifest.json

  build_nmi_figure3_redesign_v1:
    description: >-
      Rebuild NeuroSem Figure 3 from frozen forward-dose and model-space outputs using
      the final target-specific dose, transfer-utility and displacement layout.
      Presentation-only: no new evaluation, target selection, dose selection or inference.
    command:
      - .venv/bin/python
      - scripts/paper/build_nmi_figure3_redesign_v1.py
    approval: automatic
    timeout_minutes: 15
    requires_gpu: false
    resources:
      cpu_cores: 2
      min_ram_gb: 4
      wait_minutes: 15
    working_directory: .
    artifacts:
      - outputs/nmi_figure3_redesign_v1/latest/figure3.pdf
      - outputs/nmi_figure3_redesign_v1/latest/figure3.svg
      - outputs/nmi_figure3_redesign_v1/latest/figure3.png
      - outputs/nmi_figure3_redesign_v1/latest/figure3_dose_source.csv
      - outputs/nmi_figure3_redesign_v1/latest/figure3_model_space_source.csv
      - outputs/nmi_figure3_redesign_v1/latest/source_manifest.json

  build_nmi_figure4_redesign_v1:
    description: >-
      Rebuild NeuroSem Figure 4 from frozen model-family, specificity, structured-surrogate,
      model-space and reverse-transfer outputs using the final seed-aware layout.
      Presentation-only: no new training, model evaluation, neural analysis or inference.
    command:
      - .venv/bin/python
      - scripts/paper/build_nmi_figure4_redesign_v1.py
    approval: automatic
    timeout_minutes: 15
    requires_gpu: false
    resources:
      cpu_cores: 2
      min_ram_gb: 4
      wait_minutes: 15
    working_directory: .
    artifacts:
      - outputs/nmi_figure4_redesign_v1/latest/figure4.pdf
      - outputs/nmi_figure4_redesign_v1/latest/figure4.svg
      - outputs/nmi_figure4_redesign_v1/latest/figure4.png
      - outputs/nmi_figure4_redesign_v1/latest/figure4_model_family_source.csv
      - outputs/nmi_figure4_redesign_v1/latest/figure4_signal_source.csv
      - outputs/nmi_figure4_redesign_v1/latest/source_manifest.json

  build_nmi_figure5_redesign_v1:
    description: >-
      Rebuild NeuroSem Figure 5 and Extended Data Figure 1 from frozen SMN4Lang spatial,
      regional, shuffled-control and spatial-surrogate outputs. Render the complete unthresholded
      DK68 phenotype on the standard FreeSurfer fsaverage inflated surface. The atlas is a
      visualization scaffold only. Presentation-only: no model fitting, neural analysis,
      region selection, thresholding, hypothesis testing or new inference.
    command:
      - .venv/bin/python
      - scripts/paper/build_nmi_figure5_redesign_retry_v1.py
    approval: automatic
    timeout_minutes: 90
    requires_gpu: false
    resources:
      cpu_cores: 4
      min_ram_gb: 8
      wait_minutes: 90
    working_directory: .
    artifacts:
      - outputs/nmi_figure5_redesign_v1/latest/figure5.pdf
      - outputs/nmi_figure5_redesign_v1/latest/figure5.svg
      - outputs/nmi_figure5_redesign_v1/latest/figure5.png
      - outputs/nmi_figure5_redesign_v1/latest/extended_data_figure1.pdf
      - outputs/nmi_figure5_redesign_v1/latest/extended_data_figure1.svg
      - outputs/nmi_figure5_redesign_v1/latest/extended_data_figure1.png
      - outputs/nmi_figure5_redesign_v1/latest/figure5_participant_source.csv
      - outputs/nmi_figure5_redesign_v1/latest/figure5_shuffled_control_source.csv
      - outputs/nmi_figure5_redesign_v1/latest/figure5_spatial_null_source.csv
      - outputs/nmi_figure5_redesign_v1/latest/extended_data_figure1_region_source.csv
      - outputs/nmi_figure5_redesign_v1/latest/atlas_manifest.json
      - outputs/nmi_figure5_redesign_v1/latest/source_manifest.json

  export_nmi_redesign_transport_v1:
    description: >-
      Create byte-preserving safe text transports for the already-built redesigned main
      figures and bounded 2200-pixel DOCX-placement PNG derivatives for Figure 5 and
      Extended Data Figure 1. Transport/presentation only: no scientific analysis.
    command:
      - .venv/bin/python
      - scripts/paper/export_nmi_redesign_transport_v1.py
    approval: automatic
    timeout_minutes: 20
    requires_gpu: false
    resources:
      cpu_cores: 2
      min_ram_gb: 4
      wait_minutes: 20
    working_directory: .
    artifacts:
      - outputs/nmi_redesign_transport_v1/latest/figure1_svg_gzip_base64.txt
      - outputs/nmi_redesign_transport_v1/latest/figure2_svg_gzip_base64.txt
      - outputs/nmi_redesign_transport_v1/latest/figure3_svg_gzip_base64.txt
      - outputs/nmi_redesign_transport_v1/latest/figure4_svg_gzip_base64.txt
      - outputs/nmi_redesign_transport_v1/latest/figure5_docx_png_base64_part01.txt
      - outputs/nmi_redesign_transport_v1/latest/figure5_docx_png_base64_part02.txt
      - outputs/nmi_redesign_transport_v1/latest/figure5_docx_png_base64_part03.txt
      - outputs/nmi_redesign_transport_v1/latest/figure5_docx_png_base64_part04.txt
      - outputs/nmi_redesign_transport_v1/latest/extended_data_figure1_docx_png_base64_part01.txt
      - outputs/nmi_redesign_transport_v1/latest/extended_data_figure1_docx_png_base64_part02.txt
      - outputs/nmi_redesign_transport_v1/latest/manifest.json
