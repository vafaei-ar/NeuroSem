schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  probe_derco_osf_inventory:
    description: Prospectively inventory only public DERCo OSF file metadata to verify preprocessed FIF and text/table availability before any EEG materialization, reliability analysis, model loading, or NeuroSem transfer outcome.
    command:
      - .venv/bin/python
      - scripts/audit/probe_derco_osf_inventory.py
      - --output-dir
      - outputs/derco_osf_inventory/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_osf_inventory/latest/summary.json
      - outputs/derco_osf_inventory/latest/file_inventory.csv
