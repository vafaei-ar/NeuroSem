schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  run_runrelay_artifact_acceptance_v1:
    description: >-
      Create two tiny synthetic, non-sensitive artifacts to validate the full
      RunRelay workstation execution, artifact collection, R2 temporary sharing,
      and Telegram delivery path without running scientific analysis.
    command:
      - .venv/bin/python
      - scripts/runrelay_artifact_acceptance_test.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/runrelay_artifact_acceptance/latest/acceptance.json
      - outputs/runrelay_artifact_acceptance/latest/acceptance.txt

  run_runrelay_repo_health_v1:
    description: >-
      Build a safe derived health report from the actual NeuroSem RunRelay manifest
      and repository instructions, including registered-task inventory and checks
      that referenced Python task scripts exist in the exact project commit.
    command:
      - .venv/bin/python
      - scripts/runrelay_repo_health_report.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/runrelay_repo_health/latest/health.json
      - outputs/runrelay_repo_health/latest/health.txt

  run_smn4lang_regional_atlas_preflight_v1:
    description: >-
      Materialize and audit the frozen public EvLab language parcels and volumetric
      Desikan-Killiany atlas, compare only atlas grids and a representative SMN4Lang
      NIfTI header, and verify DK metadata against the frozen AHBA expression bundle.
      This task must not load BOLD values, model embeddings or scientific outcomes.
    command:
      - .venv/bin/python
      - scripts/audit/preflight_smn4lang_regional_atlases_v1.py
    approval: manual
    timeout_minutes: 15
    requires_gpu: false
    resources:
      cpu_cores: 2
      min_ram_gb: 4
      wait_minutes: 30
    working_directory: .
    artifacts:
      - outputs/smn4lang_regional_atlas_preflight_v1/latest/summary.json
      - outputs/smn4lang_regional_atlas_preflight_v1/latest/language_parcels.csv
      - outputs/smn4lang_regional_atlas_preflight_v1/latest/dk68_parcels.csv
      - outputs/smn4lang_regional_atlas_preflight_v1/latest/evlab_roi_index_audit.csv

  run_smn4lang_regional_fmri_reliability_v1:
    description: >-
      Run the frozen Stage-1 model-blind regional neural reliability analysis for
      all six EvLab language parcels and all 68 Desikan-Killiany cortical parcels,
      using the successful atlas preflight, the unchanged SMN4Lang nuisance model,
      the fixed 100-nonconstant-voxel rule, and no language-model representations.
    command:
      - .venv/bin/python
      - -m
      - scripts.analysis.run_smn4lang_regional_fmri_reliability_v1
    approval: manual
    timeout_minutes: 1440
    requires_gpu: false
    resources:
      cpu_cores: 8
      min_ram_gb: 24
      wait_minutes: 240
    working_directory: .
    artifacts:
      - outputs/smn4lang_regional_fmri_reliability_v1/latest/summary.json
      - outputs/smn4lang_regional_fmri_reliability_v1/latest/region_summary.csv
      - outputs/smn4lang_regional_fmri_reliability_v1/latest/participant_results.csv
      - outputs/smn4lang_regional_fmri_reliability_v1/latest/story_results.csv

  run_smn4lang_regional_fmri_e5_transfer_v1:
    description: >-
      Run the frozen Stage-2 regional SMN4Lang model-brain analysis using only the
      established ChineseEEG-trained multilingual-E5 lambda-0 and lambda-0.10 arms,
      reporting all six language parcels and the complete DK68 spatial phenotype
      after the completed model-blind regional reliability stage.
    command:
      - .venv/bin/python
      - -m
      - scripts.tuning.evaluate_smn4lang_regional_fmri_e5_transfer_v1
      - --device
      - auto
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    resources:
      cpu_cores: 8
      min_ram_gb: 24
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 720
    working_directory: .
    artifacts:
      - outputs/smn4lang_regional_fmri_e5_transfer_v1/latest/summary.json
      - outputs/smn4lang_regional_fmri_e5_transfer_v1/latest/region_summary.csv
      - outputs/smn4lang_regional_fmri_e5_transfer_v1/latest/participant_results.csv
      - outputs/smn4lang_regional_fmri_e5_transfer_v1/latest/story_results.csv
      - outputs/smn4lang_regional_fmri_e5_transfer_v1/latest/language_twofactor_bootstrap.csv
      - outputs/smn4lang_regional_fmri_e5_transfer_v1/latest/dk68_participant_delta_matrix.csv

  run_manuscript_figures_v2:
    description: >-
      Regenerate the locked manuscript figure/table package from already-completed
      safe derived NeuroSem outputs only, with no model fitting, feature selection,
      representation search, or new hypothesis testing.
    command:
      - .venv/bin/python
      - scripts/paper/build_manuscript_figures_v2.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/manuscript_figures_v2/latest/fig2_reading_reliability.png
      - outputs/manuscript_figures_v2/latest/fig2_reading_reliability.pdf
      - outputs/manuscript_figures_v2/latest/fig4b_smn4lang_meg_reliability_boundary.png
      - outputs/manuscript_figures_v2/latest/fig4b_smn4lang_meg_reliability_boundary.pdf
      - outputs/manuscript_figures_v2/latest/fig4_ahba_frozen_molecular_nulls.png
      - outputs/manuscript_figures_v2/latest/fig4_ahba_frozen_molecular_nulls.pdf
      - outputs/manuscript_figures_v2/latest/table2_reliability_summary.csv
      - outputs/manuscript_figures_v2/latest/table3_ahba_gene_sets.csv
      - outputs/manuscript_figures_v2/latest/table4_smn4lang_meg_reliability_boundary.csv
      - outputs/manuscript_figures_v2/latest/source_manifest.json

  build_nmi_main_figures_v3:
    description: >-
      Rebuild all four main Nature Machine Intelligence figures from frozen participant-level
      derived outputs using the final-layout v3.4 publication system, exporting editable
      vector files, 600-dpi PNGs and a SHA-256 source manifest without any new analysis.
    command:
      - .venv/bin/python
      - scripts/paper/build_nmi_main_figures_v3_4.py
    approval: manual
    timeout_minutes: 15
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/nmi_main_figures_v3/latest/figure1.pdf
      - outputs/nmi_main_figures_v3/latest/figure1.svg
      - outputs/nmi_main_figures_v3/latest/figure1.png
      - outputs/nmi_main_figures_v3/latest/figure2.pdf
      - outputs/nmi_main_figures_v3/latest/figure2.svg
      - outputs/nmi_main_figures_v3/latest/figure2.png
      - outputs/nmi_main_figures_v3/latest/figure3.pdf
      - outputs/nmi_main_figures_v3/latest/figure3.svg
      - outputs/nmi_main_figures_v3/latest/figure3.png
      - outputs/nmi_main_figures_v3/latest/figure4.pdf
      - outputs/nmi_main_figures_v3/latest/figure4.svg
      - outputs/nmi_main_figures_v3/latest/figure4.png
      - outputs/nmi_main_figures_v3/latest/source_manifest.json

  build_publication_figures_tables_v1:
    description: >-
      Rebuild and verify the current publication figure/table system in one presentation-only
      pass: final NMI main figures, existing supplementary manuscript figures/tables, and the
      frozen regional SMN4Lang figure/tables, with consolidated SHA-256 provenance and no new analysis.
    command:
      - .venv/bin/python
      - scripts/paper/build_publication_figures_tables_v1.py
    approval: manual
    timeout_minutes: 45
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/publication_figures_tables_v1/latest/reproducibility_manifest.json
      - outputs/publication_figures_tables_v1/latest/reproducibility_report.txt
      - outputs/regional_fmri_figures_tables_v1/latest/figure_regional_fmri_transfer.pdf
      - outputs/regional_fmri_figures_tables_v1/latest/figure_regional_fmri_transfer.svg
      - outputs/regional_fmri_figures_tables_v1/latest/figure_regional_fmri_transfer.png
      - outputs/regional_fmri_figures_tables_v1/latest/table_regional_language_parcels.csv
      - outputs/regional_fmri_figures_tables_v1/latest/table_supplementary_dk68_phenotype.csv
      - outputs/regional_fmri_figures_tables_v1/latest/figure_regional_fmri_transfer_caption.txt
      - outputs/regional_fmri_figures_tables_v1/latest/source_manifest.json
      - outputs/nmi_main_figures_v3/latest/source_manifest.json
      - outputs/manuscript_figures_v2/latest/source_manifest.json

  run_nmi_bidirectional_fmri_source_calibration_v1:
    description: >-
      Run the frozen source-only multilingual-E5 lambda calibration against the
      previously frozen SMN4Lang fMRI relational targets. This stage must not read
      ZuCo or ChineseEEG and stops at a source-learning gate before external testing.
    command:
      - .venv/bin/python
      - scripts/robustness/run_nmi_bidirectional_fmri_source_calibration_v1.py
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nmi_bidirectional_fmri_calibration_v1/latest/summary.json
      - outputs/nmi_bidirectional_fmri_calibration_v1/latest/lambda_*/summary.json

  run_nmi_bidirectional_fmri_to_zuco_v1:
    description: >-
      Evaluate the frozen fMRI-guided multilingual-E5 lambda-0.01 candidate against
      the independent ZuCo EEG target, using the matched lambda-0 control and no
      target-side selection or ChineseEEG access.
    command:
      - .venv/bin/python
      - scripts/robustness/evaluate_nmi_bidirectional_fmri_to_zuco_v1.py
      - --device
      - auto
    approval: manual
    timeout_minutes: 240
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nmi_bidirectional_fmri_to_zuco_v1/latest/summary.json
      - outputs/nmi_bidirectional_fmri_to_zuco_v1/latest/subject_results.csv
      - outputs/nmi_bidirectional_fmri_to_zuco_v1/latest/session_results.csv

  run_nmi_bidirectional_fmri_to_chineseeeg_run07_v1:
    description: >-
      Evaluate the already-frozen fMRI-guided multilingual-E5 lambda-0.01 candidate
      against the sealed ChineseEEG run-07 EEG holdout as a secondary consistency
      analysis, using the matched lambda-0 control with no target-side selection.
    command:
      - .venv/bin/python
      - scripts/robustness/evaluate_nmi_bidirectional_fmri_to_chineseeeg_run07_v1.py
    approval: manual
    timeout_minutes: 240
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nmi_bidirectional_fmri_to_chineseeeg_run07_v1/latest/summary.json
      - outputs/nmi_bidirectional_fmri_to_chineseeeg_run07_v1/latest/subject_results.csv

  run_nmi_bidirectional_fmri_eeg_dose_response_v1:
    description: >-
      Characterize the post-confirmatory dose-response of all already-trained
      fMRI-guided multilingual-E5 lambda adapters on both ZuCo EEG and ChineseEEG
      run-07 in one job, with no retraining, no new lambda values and no target-side
      selection.
    command:
      - .venv/bin/python
      - scripts/robustness/evaluate_nmi_bidirectional_fmri_eeg_dose_response_v1.py
    approval: manual
    timeout_minutes: 480
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nmi_bidirectional_fmri_eeg_dose_response_v1/latest/summary.json
      - outputs/nmi_bidirectional_fmri_eeg_dose_response_v1/latest/zuco_subject_dose_results.csv
      - outputs/nmi_bidirectional_fmri_eeg_dose_response_v1/latest/chineseeeg_subject_dose_results.csv

  run_nmi_fmri_to_chineseeeg_multiseed_dose_v1:
    description: >-
      Retrain the frozen SMN4Lang-fMRI multilingual-E5 lambda grid under three
      prespecified additional optimization seeds and evaluate every arm on the fixed
      ChineseEEG run-07 pipeline to characterize optimization-seed robustness without
      new lambda search or target-side selection.
    command:
      - .venv/bin/python
      - -m
      - scripts.robustness.run_nmi_fmri_to_chineseeeg_multiseed_dose_v1
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nmi_fmri_to_chineseeeg_multiseed_dose_v1/latest/summary.json
      - outputs/nmi_fmri_to_chineseeeg_multiseed_dose_v1/latest/seed_subject_lambda_results.csv
      - outputs/nmi_fmri_to_chineseeeg_multiseed_dose_v1/latest/seed_*/calibration/summary.json
      - outputs/nmi_fmri_to_chineseeeg_multiseed_dose_v1/latest/seed_*/chineseeeg/chineseeeg_subject_dose_results.csv

  run_nmi_bidirectional_model_family_panel_v1:
    description: >-
      Run the frozen six-model, three-seed explanatory multilingual model-family
      panel in both ChineseEEG-to-fMRI and fMRI-to-ZuCo directions under one common
      lambda-0.10 relational adaptation protocol, using two GPUs in parallel and no
      model-specific rescue tuning.
    command:
      - .venv/bin/python
      - scripts/robustness/run_nmi_bidirectional_model_family_panel_v1.py
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    resources:
      cpu_cores: 12
      min_ram_gb: 48
      gpu_count: 2
      min_vram_gb: 24
      wait_minutes: 720
    working_directory: .
    artifacts:
      - outputs/nmi_bidirectional_model_family_panel_v1/latest/summary.json
      - outputs/nmi_bidirectional_model_family_panel_v1/latest/resolved_models.json
      - outputs/nmi_bidirectional_model_family_panel_v1/latest/model_seed_direction_results.csv

  run_nmi_reviewer_response_scientific_suite_v1:
    description: >-
      Run the frozen post-confirmatory neural-specificity control across three E5
      seeds and both external targets, then rerun the existing participant-by-stimulus
      robustness and model-space perturbation characterization without target-side
      tuning or rescue searches.
    command:
      - .venv/bin/python
      - scripts/robustness/run_nmi_reviewer_response_scientific_suite_v1.py
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    resources:
      cpu_cores: 10
      min_ram_gb: 40
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 720
    working_directory: .
    artifacts:
      - outputs/nmi_reviewer_response_scientific_v1/latest/summary.json
      - outputs/nmi_reviewer_response_scientific_v1/latest/seed_*/zuco/*/summary.json
      - outputs/nmi_reviewer_response_scientific_v1/latest/seed_*/zuco/*/subject_results.csv
      - outputs/nmi_reviewer_response_scientific_v1/latest/seed_*/smn4lang_fmri/*/summary.json
      - outputs/nmi_reviewer_response_scientific_v1/latest/seed_*/smn4lang_fmri/*/participant_results.csv
      - outputs/nmi_hierarchical_robustness_v1/latest/summary.json
      - outputs/nmi_model_space_characterization_v1/latest/summary.json

  consolidate_nmi_reviewer_response_completed_v1:
    description: >-
      Consolidate the completed three-seed specificity evaluations, hierarchical
      bootstrap results and frozen model-space characterization into one summary
      without retraining or new model evaluation.
    command:
      - .venv/bin/python
      - scripts/robustness/consolidate_nmi_reviewer_response_completed_v1.py
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/nmi_reviewer_response_consolidated_v1/latest/summary.json
