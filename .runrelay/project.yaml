schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  audit_smn4lang_metadata:
    description: Metadata-only structural audit of OpenNeuro ds004078 SMN4Lang, inventorying participant/run completeness, shared fMRI-MEG story identities, public story text/timing annotations, preprocessed derivative availability, and annex payload sizes before any neural or model analysis.
    command:
      - python3
      - scripts/audit/audit_smn4lang_metadata.py
      - --data-root
      - data/raw/smn4lang
      - --output-dir
      - outputs/smn4lang_metadata_audit/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/smn4lang_metadata_audit/latest/summary.json
      - outputs/smn4lang_metadata_audit/latest/file_inventory.csv

  probe_smn4lang_fmri_mapping:
    description: Model-blind representative SMN4Lang fMRI mapping probe that materializes story 1 text/timing annotations and one sub-01 preprocessed CIFTI run to inspect exact temporal axes, brainordinate dimensions, and annotation schemas before freezing the fMRI semantic unit or HRF treatment.
    command:
      - .venv/bin/python
      - scripts/audit/probe_smn4lang_fmri_mapping.py
      - --data-root
      - data/raw/smn4lang
      - --output-dir
      - outputs/smn4lang_fmri_mapping_probe/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/smn4lang_fmri_mapping_probe/latest/summary.json

  audit_smn4lang_fmri_timebase:
    description: Model-blind structural timebase audit across all 12 participants and 60 SMN4Lang stories, verifying word timing monotonicity, fMRI event timing, CIFTI run completeness, within-story timepoint identity across participants, and a shared scan-time mapping before any neural reliability or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/audit_smn4lang_fmri_timebase.py
      - --data-root
      - data/raw/smn4lang
      - --output-dir
      - outputs/smn4lang_fmri_timebase_audit/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/smn4lang_fmri_timebase_audit/latest/summary.json
      - outputs/smn4lang_fmri_timebase_audit/latest/run_timebase.csv
      - outputs/smn4lang_fmri_timebase_audit/latest/story_timing.csv

  audit_smn4lang_lana_inventory:
    description: Model-blind inventory of the independently published LanA probabilistic language atlas and one representative SMN4Lang MNI-space fMRI derivative, recording atlas file provenance and exact MNI image geometry before freezing the language-network mask or computing any neural/model outcome.
    command:
      - .venv/bin/python
      - scripts/audit/audit_smn4lang_lana_inventory.py
      - --data-root
      - data/raw/smn4lang
      - --output-dir
      - outputs/smn4lang_lana_inventory/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/smn4lang_lana_inventory/latest/summary.json

  audit_smn4lang_lana_spm_atlas:
    description: Model-blind inspection of the independently released LanA SPM Atlas archive, verifying its checksum, enumerating all atlas NIfTI files, and comparing their image geometry with a representative SMN4Lang 2-mm MNI derivative before any neural or model outcome.
    command:
      - .venv/bin/python
      - scripts/audit/audit_smn4lang_lana_spm_atlas.py
      - --data-root
      - data/raw/smn4lang
      - --output-dir
      - outputs/smn4lang_lana_spm_atlas/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/smn4lang_lana_spm_atlas/latest/summary.json

  run_smn4lang_fmri_reliability:
    description: Prospectively frozen model-blind SMN4Lang fMRI neural-geometry reliability analysis across all 12 participants and 60 stories in the independently defined LanA language-network mask, with temporal, HRF word-density, and HRF acoustic-envelope nuisance controls.
    command:
      - .venv/bin/python
      - scripts/analysis/run_smn4lang_fmri_reliability.py
      - --data-root
      - data/raw/smn4lang
      - --output-dir
      - outputs/smn4lang_fmri_reliability/latest
    approval: manual
    timeout_minutes: 720
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/smn4lang_fmri_reliability/latest/summary.json
      - outputs/smn4lang_fmri_reliability/latest/participant_results.csv
      - outputs/smn4lang_fmri_reliability/latest/story_results.csv
