schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  audit_nmi_v116_provenance_v1:
    description: >-
      Run a read-only provenance audit for NMI manuscript v1.16, prioritizing STS
      reconstructibility and an inventory of manuscript-relevant completed derived
      outputs for the bidirectional claim-to-output and output-to-claim reconciliation.
      This task performs no model training, model evaluation, neural analysis,
      hypothesis testing, raw-data export, or manuscript editing.
    command:
      - .venv/bin/python
      - scripts/audit/audit_nmi_v116_provenance_v1.py
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    resources:
      cpu_cores: 2
      min_ram_gb: 4
      wait_minutes: 30
    working_directory: .
    artifacts:
      - outputs/nmi_v116_provenance_audit_v1/latest/summary.json
      - outputs/nmi_v116_provenance_audit_v1/latest/report.txt
      - outputs/nmi_v116_provenance_audit_v1/latest/sts_source_hits.csv
      - outputs/nmi_v116_provenance_audit_v1/latest/output_inventory.csv
      - outputs/nmi_v116_provenance_audit_v1/latest/candidate_sts_files.csv

  audit_nmi_v116_reconciliation_v1:
    description: >-
      Reconcile the key NMI v1.16 provenance disputes using only already-completed
      safe derived outputs and historical committed code: DERCo, E5 optimization-seed
      robustness, the two mBERT protocols, and the ZuCo cohort/exclusion metadata.
      This task performs no model training, model evaluation, neural analysis,
      hypothesis testing, raw-data export, or manuscript editing.
    command:
      - .venv/bin/python
      - scripts/audit/audit_nmi_v116_reconciliation_v1.py
    approval: manual
    timeout_minutes: 15
    requires_gpu: false
    resources:
      cpu_cores: 2
      min_ram_gb: 4
      wait_minutes: 30
    working_directory: .
    artifacts:
      - outputs/nmi_v116_reconciliation_v1/latest/summary.json
      - outputs/nmi_v116_reconciliation_v1/latest/report.txt
      - outputs/nmi_v116_reconciliation_v1/latest/source_summaries.json
      - outputs/nmi_v116_reconciliation_v1/latest/mbert_protocol_comparison.csv
      - outputs/nmi_v116_reconciliation_v1/latest/key_reconciliation_rows.csv
      - outputs/nmi_v116_reconciliation_v1/latest/multiseed_primary_table.csv

  materialize_nmi_alternative_signal_mpnet_v1:
    description: >-
      Materialize the frozen structured item-linked non-neural MPNet relational
      targets for ChineseEEG source runs 01-06 using source text and nuisance metadata
      only, before any E5 training or external evaluation. The exact immutable MPNet
      revision from the completed model-family panel may be downloaded if absent from
      the local cache. This task must not read EEG feature arrays, neural target values,
      external targets, or transfer outcomes.
    command:
      - .venv/bin/python
      - scripts/robustness/materialize_nmi_alternative_signal_mpnet_exact_prefetch_v1.py
    approval: manual
    timeout_minutes: 120
    requires_gpu: true
    resources:
      cpu_cores: 4
      min_ram_gb: 12
      gpu_count: 1
      min_vram_gb: 8
      wait_minutes: 240
    working_directory: .
    artifacts:
      - outputs/nmi_alternative_signal_mpnet_targets_v1/latest/preflight.txt
      - outputs/nmi_alternative_signal_mpnet_targets_v1/latest/summary.json
      - outputs/nmi_alternative_signal_mpnet_targets_v1/latest/report.txt
      - outputs/nmi_alternative_signal_mpnet_targets_v1/latest/target_manifest.csv

  run_nmi_alternative_signal_e5_v1:
    description: >-
      Train the single frozen structured non-neural MPNet-guided multilingual-E5
      lambda-0.10 arm at seeds 20260829, 20260830 and 20260831, reusing the completed
      seed-matched text-only controls. All three surrogate adapters must finish before
      any surrogate external outcome is opened; then evaluate every retained seed once
      on the unchanged ZuCo EEG and SMN4Lang fMRI pipelines, with no dose, checkpoint,
      seed, target or surrogate rescue after outcomes.
    command:
      - .venv/bin/python
      - scripts/robustness/run_nmi_alternative_signal_e5_v1.py
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    resources:
      cpu_cores: 8
      min_ram_gb: 24
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 720
    working_directory: .
    artifacts:
      - outputs/nmi_alternative_signal_e5_v1/latest/summary.json
      - outputs/nmi_alternative_signal_e5_v1/latest/report.txt
      - outputs/nmi_alternative_signal_e5_v1/latest/seed_target_results.csv
      - outputs/nmi_alternative_signal_e5_v1/latest/training_manifest.json

  resume_nmi_alternative_signal_e5_v1:
    description: >-
      Recover the frozen MPNet alternative-signal control after parent job H7M4K9R2
      completed all three surrogate trainings and both seed-20260829 external
      evaluations but failed only while parsing the fMRI summary. Verify exact adapter
      provenance, reuse already-complete seed-20260829 outputs without recomputation,
      run only missing ZuCo and SMN4Lang evaluations for seeds 20260830 and 20260831,
      and consolidate all six frozen results. No retraining, dose search, checkpoint
      selection, seed exclusion, target change or surrogate substitution is allowed.
    command:
      - .venv/bin/python
      - scripts/robustness/resume_nmi_alternative_signal_e5_v1.py
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    resources:
      cpu_cores: 8
      min_ram_gb: 24
      gpu_count: 1
      min_vram_gb: 24
      wait_minutes: 720
    working_directory: .
    artifacts:
      - outputs/nmi_alternative_signal_e5_v1/latest/summary.json
      - outputs/nmi_alternative_signal_e5_v1/latest/report.txt
      - outputs/nmi_alternative_signal_e5_v1/latest/seed_target_results.csv
      - outputs/nmi_alternative_signal_e5_v1/latest/recovery_manifest.json
      - outputs/nmi_alternative_signal_e5_v1/latest/recovery_execution.csv
