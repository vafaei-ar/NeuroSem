schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  build_nmi_bidirectional_fmri_source_v1:
    description: >-
      Build and freeze the model-blind SMN4Lang fMRI group relational targets and
      deterministic train/validation split for the post-confirmatory bidirectional
      cross-modal transfer experiment. No language model or external EEG target is read.
    command:
      - .venv/bin/python
      - scripts/robustness/build_nmi_bidirectional_fmri_source_v1.py
    approval: manual
    timeout_minutes: 360
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/nmi_bidirectional_fmri_source_v1/latest/summary.json
      - outputs/nmi_bidirectional_fmri_source_v1/latest/split.json
