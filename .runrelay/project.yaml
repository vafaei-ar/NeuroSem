schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  audit_smn4lang_metadata:
    description: Metadata-only structural audit of OpenNeuro ds004078 SMN4Lang, inventorying participant/run completeness, shared fMRI-MEG story identities, public story text/timing annotations, preprocessed derivative availability, and annex payload sizes before any neural or model analysis.
    command:
      - python3
      - scripts/audit/audit_smn4lang_metadata.py
      - --data-root
      - data/raw/smn4lang
      - --output-dir
      - outputs/smn4lang_metadata_audit/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/smn4lang_metadata_audit/latest/summary.json
      - outputs/smn4lang_metadata_audit/latest/file_inventory.csv
