schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  smoke_test:
    description: Non-destructive RunRelay connectivity test.
    command:
      - python3
      - -c
      - "import os,platform; print('RUNRELAY_SMOKE_OK'); print('host='+platform.node()); print('cwd='+os.getcwd())"
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .

  drive_artifact_smoke:
    description: Create one harmless JSON artifact to verify RunRelay Google Drive delivery and ChatGPT retrieval.
    command:
      - python3
      - scripts/runrelay/drive_smoke.py
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/runrelay_drive_smoke/latest/summary.json

  setup_venv:
    description: Create or refresh the NeuroSem Python virtual environment.
    command:
      - bash
      - scripts/setup_venv.sh
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .

  download_chineseeeg:
    description: Download the ChineseEEG dataset using the project download script.
    command:
      - bash
      - scripts/download/download_chineseeeg.sh
    approval: manual
    timeout_minutes: 720
    requires_gpu: false
    working_directory: .

  audit_chineseeeg:
    description: Run the structural and metadata audit and create the audit ZIP.
    command:
      - .venv/bin/python
      - scripts/audit/audit_chineseeeg.py
      - data/raw/chineseeeg
      - --output-dir
      - outputs/chineseeeg_audit
      - --make-zip
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/chineseeeg_audit/**/*

  audit_chineseeeg_time_resolved_inputs:
    description: Model-blind inventory of locally available ChineseEEG time-resolved EEG, event, eye-tracking, filtered-derivative, and ICA/component inputs for representation refinement.
    command:
      - .venv/bin/python
      - scripts/audit/audit_chineseeeg_time_resolved_inputs.py
      - --data-root
      - data/raw/chineseeeg
      - --outputs-root
      - outputs
      - --output-dir
      - outputs/chineseeeg_time_resolved_input_audit/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/chineseeeg_time_resolved_input_audit/latest/summary.json
      - outputs/chineseeeg_time_resolved_input_audit/latest/file_inventory.csv

  run_chineseeeg_eeg_representation_overnight:
    description: Run the model-blind overnight ChineseEEG representation benchmark with amplitude, spatial, spectral-power, phase-feasibility, run-06 selection, and locked run-07 EEG-only holdout subjobs.
    command:
      - .venv/bin/python
      - scripts/analysis/run_chineseeeg_eeg_representation_overnight.py
      - --data-root
      - data/raw/chineseeeg
      - --feature-root
      - outputs/chineseeeg_row_features
      - --discovery-run
      - run-06
      - --holdout-run
      - run-07
      - --output-dir
      - outputs/chineseeeg_eeg_representation_overnight/latest
    approval: manual
    timeout_minutes: 540
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/chineseeeg_eeg_representation_overnight/latest/summary.json
      - outputs/chineseeeg_eeg_representation_overnight/latest/candidate_metrics.csv
      - outputs/chineseeeg_eeg_representation_overnight/latest/subject_metrics.csv
      - outputs/chineseeeg_eeg_representation_overnight/latest/sensor_groups.json

  run_chineseeeg_spectral_phase_strict:
    description: Materialize the exact run-06/run-07 30-Hz and 80-Hz BrainVision companions, rerun the model-blind EEG representation benchmark, and fail unless all spectral-power and phase candidate families actually execute.
    command:
      - bash
      - scripts/analysis/run_chineseeeg_eeg_representation_spectral_phase_strict.sh
    approval: manual
    timeout_minutes: 540
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/chineseeeg_eeg_representation_overnight/latest/summary.json
      - outputs/chineseeeg_eeg_representation_overnight/latest/candidate_metrics.csv
      - outputs/chineseeeg_eeg_representation_overnight/latest/subject_metrics.csv
      - outputs/chineseeeg_eeg_representation_overnight/latest/sensor_groups.json

  download_tmnred:
    description: Create a pinned OpenNeuro ds005383 TMNRED DataLad/git-annex checkout without recursively materializing EEG payloads.
    command:
      - bash
      - scripts/download/download_tmnred.sh
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .

  audit_tmnred:
    description: Run the prospective model-blind structural and materialization audit for TMNRED before any signal-level representation or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/audit_tmnred.py
      - --data-root
      - data/raw/tmnred
      - --output-dir
      - outputs/tmnred_audit/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/tmnred_audit/latest/summary.json
      - outputs/tmnred_audit/latest/file_inventory.csv

  probe_tmnred_docs:
    description: Read only already-materialized TMNRED documentation, sidecars, event schemas, and derivative path metadata before freezing signal-level analysis.
    command:
      - .venv/bin/python
      - scripts/audit/probe_tmnred_docs.py
      - --data-root
      - data/raw/tmnred
      - --output-dir
      - outputs/tmnred_docs_probe/latest
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/tmnred_docs_probe/latest/summary.json

  probe_tmnred_preproc_format:
    description: Materialize only one representative TMNRED subject/session preprocessed file set and inspect EEGLAB/MAT metadata before freezing the full signal-level representation source.
    command:
      - .venv/bin/python
      - scripts/audit/probe_tmnred_preproc_format.py
      - --data-root
      - data/raw/tmnred
      - --output-dir
      - outputs/tmnred_preproc_format_probe/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/tmnred_preproc_format_probe/latest/summary.json

  probe_tmnred_event_alignment:
    description: Compare one representative TMNRED BIDS event table with continuous and artifact-rejected preprocessed EEGLAB event metadata to freeze trial-identity alignment before signal-level analysis.
    command:
      - .venv/bin/python
      - scripts/audit/probe_tmnred_event_alignment.py
      - --data-root
      - data/raw/tmnred
      - --output-dir
      - outputs/tmnred_event_alignment_probe/latest
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/tmnred_event_alignment_probe/latest/summary.json

  probe_tmnred_stimulus_metadata:
    description: Materialize only the public TMNRED source-material spreadsheet/CSV and inspect their schema to freeze the semantic analysis unit before any EEG reliability or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/probe_tmnred_stimulus_metadata.py
      - --data-root
      - data/raw/tmnred
      - --output-dir
      - outputs/tmnred_stimulus_metadata_probe/latest
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/tmnred_stimulus_metadata_probe/latest/summary.json

  materialize_tmnred_representation_inputs:
    description: Materialize the prospectively frozen TMNRED artifact-rejected epoched z.set inputs and exact external companions for all 30 participants and eight sessions, then freeze the model-blind ready cohort.
    command:
      - .venv/bin/python
      - scripts/audit/materialize_tmnred_representation_inputs.py
      - --data-root
      - data/raw/tmnred
      - --output-dir
      - outputs/tmnred_representation_input_materialization/latest
      - --min-retained-trials
      - "30"
    approval: manual
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/tmnred_representation_input_materialization/latest/summary.json
      - outputs/tmnred_representation_input_materialization/latest/session_inventory.csv

  run_tmnred_primary_representation_reliability:
    description: Run the prospectively frozen model-blind TMNRED primary EEG representation reliability analysis for the ChineseEEG-selected all-sensor temporal mean, with amplitude-SD and 8-bin sensitivity controls.
    command:
      - .venv/bin/python
      - scripts/analysis/run_tmnred_primary_representation_reliability.py
      - --data-root
      - data/raw/tmnred
      - --input-freeze
      - outputs/tmnred_representation_input_materialization/latest/summary.json
      - --output-dir
      - outputs/tmnred_primary_representation_reliability/latest
      - --min-reference-edge-subjects
      - "18"
    approval: manual
    timeout_minutes: 180
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/tmnred_primary_representation_reliability/latest/summary.json
      - outputs/tmnred_primary_representation_reliability/latest/candidate_metrics.csv
      - outputs/tmnred_primary_representation_reliability/latest/subject_metrics.csv

  run_tmnred_e5_transfer:
    description: Run the frozen ChineseEEG-to-TMNRED multilingual-E5 external transfer test on the prospectively designated TMNRED all-sensor temporal-mean EEG target, comparing lambda 0.10 neural-guided against lambda 0 text-only with no TMNRED tuning.
    command:
      - .venv/bin/python
      - scripts/tuning/evaluate_tmnred_e5_transfer_v1.py
      - --data-root
      - data/raw/tmnred
      - --input-freeze
      - outputs/tmnred_representation_input_materialization/latest/summary.json
      - --output-dir
      - outputs/tmnred_e5_transfer_v1/latest
      - --device
      - auto
    approval: manual
    timeout_minutes: 180
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/tmnred_e5_transfer_v1/latest/summary.json
      - outputs/tmnred_e5_transfer_v1/latest/subject_results.csv
      - outputs/tmnred_e5_transfer_v1/latest/session_results.csv

  run_tmnred_e5_alternative_representations:
    description: Run the frozen post-confirmatory exploratory TMNRED E5 transfer analysis for the two already-defined sensitivity EEG representations, row_std_all and relative_8bin_all, without TMNRED tuning.
    command:
      - .venv/bin/python
      - scripts/tuning/evaluate_tmnred_e5_alternative_representations_v1.py
      - --data-root
      - data/raw/tmnred
      - --input-freeze
      - outputs/tmnred_representation_input_materialization/latest/summary.json
      - --output-dir
      - outputs/tmnred_e5_alternative_representations_v1/latest
      - --device
      - auto
    approval: manual
    timeout_minutes: 180
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/tmnred_e5_alternative_representations_v1/latest/summary.json
      - outputs/tmnred_e5_alternative_representations_v1/latest/subject_results.csv
      - outputs/tmnred_e5_alternative_representations_v1/latest/session_results.csv

  probe_tmnred_materialization_failures:
    description: Model-blind structural probe for TMNRED z.set materialization failures, including exact scipy errors, MATLAB/HDF5 format detection, and canonical neighboring z.fdt companion checks.
    command:
      - .venv/bin/python
      - scripts/audit/probe_tmnred_materialization_failures.py
      - --data-root
      - data/raw/tmnred
      - --output-dir
      - outputs/tmnred_materialization_failure_probe/latest
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/tmnred_materialization_failure_probe/latest/summary.json

  run_e5_replication:
    description: Run the frozen multilingual-E5 neural-guided replication, run-07 neural holdout, and frozen external STS benchmark.
    command:
      - bash
      - scripts/tuning/run_e5_neurosem_replication.sh
    approval: manual
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/e5_neural_tuning_v1/**/summary.json
      - outputs/e5_neurosem_run07_embeddings_v1/**/summary.json
      - outputs/e5_neurosem_run07_rsa_v1/**/summary.json
      - outputs/e5_neurosem_cmteb_sts_v1/**/summary.json

  collect_e5_results:
    description: Collect already-completed E5 replication summaries into one safe derived report without rerunning training or evaluation.
    command:
      - .venv/bin/python
      - scripts/tuning/collect_e5_replication_results.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/e5_replication_report/latest/combined_summary.json

  run_e5_pareto_exploratory:
    description: Run the prespecified exploratory E5 neural-loss dose-response/Pareto experiment using four new intermediate lambdas and reusing the completed lambda 0 and 1 anchors.
    command:
      - bash
      - scripts/tuning/run_e5_pareto_exploratory_v1.sh
    approval: manual
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/e5_pareto_v1/latest/combined_summary.json
      - outputs/e5_pareto_v1/latest/pareto_points.csv

  evaluate_e5_pareto_existing:
    description: Evaluate the already-trained E5 Pareto grid and frozen anchors without retraining any model.
    command:
      - bash
      - scripts/tuning/run_e5_pareto_evaluation_only_v1.sh
    approval: manual
    timeout_minutes: 240
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/e5_pareto_v1/latest/combined_summary.json
      - outputs/e5_pareto_v1/latest/pareto_points.csv

  download_nature_directional_eeg:
    description: Download and checksum-verify the Scientific Data 2026 directional-word EEG dataset from pinned Zenodo record 20374418.
    command:
      - bash
      - scripts/download/download_nature_directional_eeg.sh
    approval: manual
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .

  audit_nature_directional_eeg:
    description: Run a model-blind structural audit of the downloaded directional-word EEG dataset before any neural-model comparison.
    command:
      - .venv/bin/python
      - scripts/audit/audit_nature_directional_eeg.py
      - data/raw/nature_directional_eeg/extracted
      - --output-dir
      - outputs/nature_directional_eeg_audit/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/nature_directional_eeg_audit/latest/summary.json
      - outputs/nature_directional_eeg_audit/latest/subject_inventory.csv

  probe_nature_directional_events:
    description: Inspect only event labels and public metadata needed to freeze the Nature directional EEG validation; does not load models or compute neural-model RSA.
    command:
      - .venv/bin/python
      - scripts/audit/probe_nature_directional_event_mapping.py
      - data/raw/nature_directional_eeg/extracted/inner_speech_v2
      - --output-dir
      - outputs/nature_directional_event_probe/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/nature_directional_event_probe/latest/summary.json
      - outputs/nature_directional_event_probe/latest/event_counts.csv

  probe_nature_directional_docs:
    description: Inspect only the downloaded README and data dictionary to resolve event-label condition mapping before any model comparison.
    command:
      - .venv/bin/python
      - scripts/audit/probe_nature_directional_docs.py
      - data/raw/nature_directional_eeg/extracted/inner_speech_v2
      - --output-dir
      - outputs/nature_directional_docs_probe/latest
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/nature_directional_docs_probe/latest/summary.json

  run_nature_directional_validation:
    description: Run the frozen prospective Nature directional-word EEG external validation comparing E5 lambda 0.10 against lambda 0 text-only, with secondary frozen E5 controls.
    command:
      - bash
      - scripts/tuning/run_nature_directional_validation_v1.sh
    approval: manual
    timeout_minutes: 120
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nature_directional_neurosem_v1/latest/summary.json
      - outputs/nature_directional_neurosem_v1/latest/subject_results.csv
      - outputs/nature_directional_neurosem_v1/latest/model_rdm_edges.csv

  probe_zuco_osf_inventory:
    description: Model-blind inventory of the public ZuCo 1.0 and ZuCo 2.0 OSF storage trees to choose a feasible normal-reading signal source before downloading EEG payloads.
    command:
      - .venv/bin/python
      - scripts/audit/probe_zuco_osf_inventory.py
      - --output-dir
      - outputs/zuco_osf_inventory/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/zuco_osf_inventory/latest/summary.json
      - outputs/zuco_osf_inventory/latest/inventory.csv

  probe_zuco2_nr_format:
    description: Materialize only the seven shared ZuCo 2.0 Task 1 normal-reading word-boundary files and one representative preprocessed EEG run (YDG NR1), then inspect MATLAB structure without computing EEG reliability or model alignment.
    command:
      - .venv/bin/python
      - scripts/audit/probe_zuco2_nr_format.py
      - --data-root
      - data/raw/zuco2_probe
      - --output-dir
      - outputs/zuco2_nr_format_probe/latest
    approval: manual
    timeout_minutes: 90
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/zuco2_nr_format_probe/latest/summary.json

  materialize_zuco2_nr_inputs:
    description: Materialize all public ZuCo 2.0 Task 1 normal-reading preprocessed EEG runs, verify the frozen sentence-event mapping across the full cohort, and freeze structurally ready subjects before any reliability analysis.
    command:
      - .venv/bin/python
      - scripts/audit/materialize_zuco2_nr_inputs.py
      - --data-root
      - data/raw/zuco2_nr
      - --output-dir
      - outputs/zuco2_nr_input_materialization/latest
    approval: manual
    timeout_minutes: 720
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/zuco2_nr_input_materialization/latest/summary.json
      - outputs/zuco2_nr_input_materialization/latest/session_inventory.csv

  run_zuco2_nr_primary_representation_reliability:
    description: Run the prospectively frozen model-blind ZuCo 2.0 Task 1 normal-reading EEG reliability analysis with all-retained-channel temporal mean as primary and SD/relative-8-bin sensitivity representations.
    command:
      - .venv/bin/python
      - scripts/analysis/run_zuco2_nr_primary_representation_reliability.py
      - --data-root
      - data/raw/zuco2_nr
      - --input-freeze
      - outputs/zuco2_nr_input_materialization/latest/summary.json
      - --mapping-freeze
      - outputs/zuco2_nr_format_probe/latest/summary.json
      - --stimulus-root
      - data/raw/zuco2_probe
      - --output-dir
      - outputs/zuco2_nr_primary_representation_reliability/latest
      - --min-reference-edge-subjects
      - "12"
    approval: manual
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/zuco2_nr_primary_representation_reliability/latest/summary.json
      - outputs/zuco2_nr_primary_representation_reliability/latest/candidate_metrics.csv
      - outputs/zuco2_nr_primary_representation_reliability/latest/subject_metrics.csv
      - outputs/zuco2_nr_primary_representation_reliability/latest/session_metrics.csv

  run_zuco2_nr_e5_transfer:
    description: Run the single frozen ChineseEEG-to-ZuCo 2.0 Task 1 normal-reading multilingual-E5 transfer test, comparing lambda 0.10 neural-guided against lambda 0 text-only on the prospectively frozen all-retained-channel temporal-mean EEG geometry with no ZuCo tuning.
    command:
      - .venv/bin/python
      - scripts/tuning/evaluate_zuco2_nr_e5_transfer_v1.py
      - --data-root
      - data/raw/zuco2_nr
      - --input-freeze
      - outputs/zuco2_nr_input_materialization/latest/summary.json
      - --mapping-freeze
      - outputs/zuco2_nr_format_probe/latest/summary.json
      - --stimulus-root
      - data/raw/zuco2_probe
      - --output-dir
      - outputs/zuco2_nr_e5_transfer_v1/latest
      - --device
      - auto
    approval: manual
    timeout_minutes: 180
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/zuco2_nr_e5_transfer_v1/latest/summary.json
      - outputs/zuco2_nr_e5_transfer_v1/latest/subject_results.csv
      - outputs/zuco2_nr_e5_transfer_v1/latest/session_results.csv

  probe_garnett_dream_structure:
    description: Model-blind inventory of ChineseEEG Garnett Dream task files, event metadata, participant/run coverage, and current materialization state before any neural reliability or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/probe_garnett_dream_structure.py
      - --data-root
      - data/raw/chineseeeg
      - --output-dir
      - outputs/garnett_dream_structure_probe/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/garnett_dream_structure_probe/latest/summary.json
      - outputs/garnett_dream_structure_probe/latest/file_inventory.csv
      - outputs/garnett_dream_structure_probe/latest/events_summary.json

  probe_garnett_dream_alignment_freeze:
    description: Run the corrected model-blind Garnett Dream event/text/materialization freeze probe, explicitly restricted to ses-GarnettDream, before any EEG reliability or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/probe_garnett_dream_alignment_freeze.py
      - --data-root
      - data/raw/chineseeeg
      - --output-dir
      - outputs/garnett_dream_alignment_freeze_probe/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/garnett_dream_alignment_freeze_probe/latest/summary.json
      - outputs/garnett_dream_alignment_freeze_probe/latest/event_structure.json
      - outputs/garnett_dream_alignment_freeze_probe/latest/text_candidates.json
      - outputs/garnett_dream_alignment_freeze_probe/latest/materialization_inventory.csv

  materialize_garnett_dream_inputs:
    description: Materialize the frozen Garnett Dream filtered_0.5_30 BrainVision companions and freeze row identities as chapter plus within-run ROWS-to-ROWE index, without loading EEG samples or computing outcomes.
    command:
      - .venv/bin/python
      - scripts/audit/materialize_garnett_dream_inputs.py
      - --data-root
      - data/raw/chineseeeg
      - --alignment-freeze
      - outputs/garnett_dream_alignment_freeze_probe/latest/summary.json
      - --output-dir
      - outputs/garnett_dream_input_materialization/latest
    approval: manual
    timeout_minutes: 720
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/garnett_dream_input_materialization/latest/summary.json
      - outputs/garnett_dream_input_materialization/latest/session_inventory.csv
      - outputs/garnett_dream_input_materialization/latest/item_identity.csv

  run_garnett_dream_primary_reliability:
    description: Run the prospectively frozen Garnett Dream EEG-only cross-subject reliability analysis with row_mean_all primary and row_std_all/relative_8bin_all sensitivities, using only the model-blind structural nuisance subset available before exact row-text mapping.
    command:
      - .venv/bin/python
      - scripts/analysis/run_garnett_dream_primary_reliability.py
      - --data-root
      - data/raw/chineseeeg
      - --input-freeze
      - outputs/garnett_dream_input_materialization/latest/summary.json
      - --session-inventory
      - outputs/garnett_dream_input_materialization/latest/session_inventory.csv
      - --item-identity
      - outputs/garnett_dream_input_materialization/latest/item_identity.csv
      - --output-dir
      - outputs/garnett_dream_primary_reliability/latest
    approval: manual
    timeout_minutes: 360
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/garnett_dream_primary_reliability/latest/summary.json
