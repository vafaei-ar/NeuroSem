schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  run_nmi_postconfirmatory_robustness_v1:
    description: >-
      Run the frozen post-confirmatory NMI robustness suite: participant-by-stimulus
      bootstrap, model-space characterization, and three additional fixed E5
      optimization seeds evaluated on frozen ZuCo and SMN4Lang fMRI targets.
    command:
      - bash
      - scripts/robustness/run_nmi_postconfirmatory_suite_v1.sh
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nmi_hierarchical_robustness_v1/latest/summary.json
      - outputs/nmi_model_space_characterization_v1/latest/summary.json
      - outputs/nmi_model_space_characterization_v1/latest/item_metrics.csv
      - outputs/nmi_multiseed_e5_v1/latest/summary.json
      - outputs/nmi_multiseed_e5_v1/seed_*/zuco/summary.json
      - outputs/nmi_multiseed_e5_v1/seed_*/zuco/subject_results.csv
      - outputs/nmi_multiseed_e5_v1/seed_*/smn4lang_fmri/summary.json
      - outputs/nmi_multiseed_e5_v1/seed_*/smn4lang_fmri/participant_results.csv
