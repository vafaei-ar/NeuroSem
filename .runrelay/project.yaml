schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  run_nmi_model_family_mbert_v1:
    description: >-
      Run the frozen post-confirmatory second-model-family robustness experiment using
      multilingual BERT, strict lambda 0.10 portability, three prespecified seeds,
      and unchanged ZuCo EEG and SMN4Lang fMRI external targets.
    command:
      - .venv/bin/python
      - scripts/robustness/run_nmi_model_family_mbert_v1.py
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nmi_model_family_mbert_v1/latest/summary.json
      - outputs/nmi_model_family_mbert_v1/seed_*/zuco/summary.json
      - outputs/nmi_model_family_mbert_v1/seed_*/zuco/subject_results.csv
      - outputs/nmi_model_family_mbert_v1/seed_*/smn4lang_fmri/summary.json
      - outputs/nmi_model_family_mbert_v1/seed_*/smn4lang_fmri/participant_results.csv
