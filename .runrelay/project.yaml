schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: null
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  smoke_test:
    description: Non-destructive RunRelay connectivity test.
    command:
      - python3
      - -c
      - "import os,platform; print('RUNRELAY_SMOKE_OK'); print('host='+platform.node()); print('cwd='+os.getcwd())"
    approval: manual
    timeout_minutes: 5
    requires_gpu: false
    working_directory: .

  setup_venv:
    description: Create or refresh the NeuroSem Python virtual environment.
    command:
      - bash
      - scripts/setup_venv.sh
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .

  download_chineseeeg:
    description: Download the ChineseEEG dataset using the project download script.
    command:
      - bash
      - scripts/download/download_chineseeeg.sh
    approval: manual
    timeout_minutes: 720
    requires_gpu: false
    working_directory: .

  audit_chineseeeg:
    description: Run the structural and metadata audit and create the audit ZIP.
    command:
      - .venv/bin/python
      - scripts/audit/audit_chineseeeg.py
      - data/raw/chineseeeg
      - --output-dir
      - outputs/chineseeeg_audit
      - --make-zip
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/chineseeeg_audit/**/*

  run_e5_replication:
    description: Run the frozen multilingual-E5 neural-guided replication, run-07 neural holdout, and frozen external STS benchmark.
    command:
      - bash
      - scripts/tuning/run_e5_neurosem_replication.sh
    approval: manual
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/e5_neural_tuning_v1/**/summary.json
      - outputs/e5_neurosem_run07_embeddings_v1/**/summary.json
      - outputs/e5_neurosem_run07_rsa_v1/**/summary.json
      - outputs/e5_neurosem_cmteb_sts_v1/**/summary.json

  collect_e5_results:
    description: Collect already-completed E5 replication summaries into one safe derived report without rerunning training or evaluation.
    command:
      - .venv/bin/python
      - scripts/tuning/collect_e5_replication_results.py
    approval: manual
    timeout_minutes: 10
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/e5_replication_report/latest/combined_summary.json

  run_e5_pareto_exploratory:
    description: Run the prespecified exploratory E5 neural-loss dose-response/Pareto experiment using four new intermediate lambdas and reusing the completed lambda 0 and 1 anchors.
    command:
      - bash
      - scripts/tuning/run_e5_pareto_exploratory_v1.sh
    approval: manual
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/e5_pareto_v1/latest/combined_summary.json
      - outputs/e5_pareto_v1/latest/pareto_points.csv

  evaluate_e5_pareto_existing:
    description: Evaluate the already-trained E5 Pareto grid and frozen anchors without retraining any model.
    command:
      - bash
      - scripts/tuning/run_e5_pareto_evaluation_only_v1.sh
    approval: manual
    timeout_minutes: 240
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/e5_pareto_v1/latest/combined_summary.json
      - outputs/e5_pareto_v1/latest/pareto_points.csv

  download_nature_directional_eeg:
    description: Download and checksum-verify the Scientific Data 2026 directional-word EEG dataset from pinned Zenodo record 20374418.
    command:
      - bash
      - scripts/download/download_nature_directional_eeg.sh
    approval: manual
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .

  audit_nature_directional_eeg:
    description: Run a model-blind structural audit of the downloaded directional-word EEG dataset before any neural-model comparison.
    command:
      - .venv/bin/python
      - scripts/audit/audit_nature_directional_eeg.py
      - data/raw/nature_directional_eeg/extracted
      - --output-dir
      - outputs/nature_directional_eeg_audit/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/nature_directional_eeg_audit/latest/summary.json
      - outputs/nature_directional_eeg_audit/latest/subject_inventory.csv

  probe_nature_directional_events:
    description: Inspect only event labels and public metadata needed to freeze the Nature directional EEG validation; does not load models or compute neural-model RSA.
    command:
      - .venv/bin/python
      - scripts/audit/probe_nature_directional_event_mapping.py
      - data/raw/nature_directional_eeg/extracted/inner_speech_v2
      - --output-dir
      - outputs/nature_directional_event_probe/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/nature_directional_event_probe/latest/summary.json
      - outputs/nature_directional_event_probe/latest/event_counts.csv
