schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  materialize_derco_reliability_inputs:
    description: Prospectively materialize all public DERCo preprocessed EEG epochs for all 22 participants and five articles, validate exact retained-epoch word identity against the public article prediction tables, and freeze the structural cohort before any EEG reliability or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/materialize_derco_reliability_inputs.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_reliability_input_materialization/latest
    approval: manual
    timeout_minutes: 720
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_reliability_input_materialization/latest/summary.json
      - outputs/derco_reliability_input_materialization/latest/session_inventory.csv
      - outputs/derco_reliability_input_materialization/latest/canonical_word_map.csv

  diagnose_derco_event_index_offsets:
    description: Model-blind diagnostic of constant small integer offsets between DERCo FIF event-label suffixes and published article word indices using already-materialized files only.
    command:
      - .venv/bin/python
      - scripts/audit/diagnose_derco_event_index_offsets.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_event_index_offset_diagnostic/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_event_index_offset_diagnostic/latest/summary.json
      - outputs/derco_event_index_offset_diagnostic/latest/offset_diagnostic.csv

  diagnose_derco_monotonic_word_alignment:
    description: Model-blind diagnostic aligning retained DERCo event-word sequences monotonically to the published article word sequence, testing whether exact item identity is uniquely recoverable without EEG amplitudes or model outcomes.
    command:
      - .venv/bin/python
      - scripts/audit/diagnose_derco_monotonic_word_alignment.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_monotonic_word_alignment_diagnostic/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_monotonic_word_alignment_diagnostic/latest/summary.json
      - outputs/derco_monotonic_word_alignment_diagnostic/latest/alignment_diagnostic.csv

  audit_derco_fif_metadata_mapping:
    description: Definitive model-blind audit of DERCo preprocessed FIF-attached stimulus metadata, requiring exact consistency between metadata index/word fields and retained event labels across all 22 participants and five articles before any neural reliability or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/audit_derco_fif_metadata_mapping.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_fif_metadata_mapping_audit/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_fif_metadata_mapping_audit/latest/summary.json
      - outputs/derco_fif_metadata_mapping_audit/latest/file_audit.csv
