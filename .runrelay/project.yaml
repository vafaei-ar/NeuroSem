schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  probe_derco_materialization_alignment:
    description: Prospectively download one public DERCo preprocessed FIF and the five public prediction CSVs to inspect only structural metadata and linguistic item-mapping feasibility before any EEG reliability or NeuroSem model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/probe_derco_materialization_alignment.py
      - --data-root
      - data/raw/derco_probe
      - --output-dir
      - outputs/derco_materialization_alignment_probe/latest
    approval: manual
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_materialization_alignment_probe/latest/summary.json
      - outputs/derco_materialization_alignment_probe/latest/prediction_schema.csv
