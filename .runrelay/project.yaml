schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  materialize_derco_reliability_inputs:
    description: Prospectively materialize all public DERCo preprocessed EEG epochs for all 22 participants and five articles, validate exact retained-epoch word identity against the public article prediction tables, and freeze the structural cohort before any EEG reliability or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/materialize_derco_reliability_inputs.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_reliability_input_materialization/latest
    approval: manual
    timeout_minutes: 720
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_reliability_input_materialization/latest/summary.json
      - outputs/derco_reliability_input_materialization/latest/session_inventory.csv
      - outputs/derco_reliability_input_materialization/latest/canonical_word_map.csv

  diagnose_derco_event_index_offsets:
    description: Model-blind diagnostic of constant small integer offsets between DERCo FIF event-label suffixes and published article word indices using already-materialized files only.
    command:
      - .venv/bin/python
      - scripts/audit/diagnose_derco_event_index_offsets.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_event_index_offset_diagnostic/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_event_index_offset_diagnostic/latest/summary.json
      - outputs/derco_event_index_offset_diagnostic/latest/offset_diagnostic.csv

  diagnose_derco_monotonic_word_alignment:
    description: Model-blind diagnostic aligning retained DERCo event-word sequences monotonically to the published article word sequence, testing whether exact item identity is uniquely recoverable without EEG amplitudes or model outcomes.
    command:
      - .venv/bin/python
      - scripts/audit/diagnose_derco_monotonic_word_alignment.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_monotonic_word_alignment_diagnostic/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_monotonic_word_alignment_diagnostic/latest/summary.json
      - outputs/derco_monotonic_word_alignment_diagnostic/latest/alignment_diagnostic.csv

  audit_derco_fif_metadata_mapping:
    description: Definitive model-blind audit of DERCo preprocessed FIF-attached stimulus metadata, requiring exact consistency between metadata index/word fields and retained event labels across all 22 participants and five articles before any neural reliability or model analysis.
    command:
      - .venv/bin/python
      - scripts/audit/audit_derco_fif_metadata_mapping.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_fif_metadata_mapping_audit/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_fif_metadata_mapping_audit/latest/summary.json
      - outputs/derco_fif_metadata_mapping_audit/latest/file_audit.csv

  diagnose_derco_fif_metadata_index_semantics:
    description: Model-blind diagnostic of which preserved FIF metadata index representation matches DERCo event-label stimulus suffixes, comparing pandas metadata index, retained-row ordinals, and numeric nonblank WordID while independently checking word and article agreement.
    command:
      - .venv/bin/python
      - scripts/audit/diagnose_derco_fif_metadata_index_semantics.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_fif_metadata_index_semantics/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_fif_metadata_index_semantics/latest/summary.json
      - outputs/derco_fif_metadata_index_semantics/latest/file_diagnostic.csv

  audit_derco_event_label_item_identity:
    description: Final model-blind structural audit using DERCo event labels themselves as participant-independent item keys, requiring parseable word/article/stimulus-index labels, within-file monotonic unique indices, and zero cross-participant word conflicts for any shared article/index key.
    command:
      - .venv/bin/python
      - scripts/audit/audit_derco_event_label_item_identity.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_event_label_item_identity/latest
    approval: manual
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_event_label_item_identity/latest/summary.json
      - outputs/derco_event_label_item_identity/latest/file_audit.csv
      - outputs/derco_event_label_item_identity/latest/item_key_audit.csv

  run_derco_eeg_reliability:
    description: Run the prospectively frozen DERCo EEG-only leave-one-participant-out neural-geometry reliability analysis on all 22 participants and five articles, using event-label item identity, row_mean_all, and prespecified nuisance residualization, with no model or transfer outcomes.
    command:
      - .venv/bin/python
      - scripts/analysis/run_derco_eeg_reliability.py
      - --data-root
      - data/raw/derco
      - --output-dir
      - outputs/derco_eeg_reliability/latest
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    artifacts:
      - outputs/derco_eeg_reliability/latest/summary.json
      - outputs/derco_eeg_reliability/latest/participant_article_reliability.csv

  run_derco_e5_transfer:
    description: Run the single prospectively gated DERCo model-transfer contrast using the frozen ChineseEEG-trained multilingual-E5 lambda 0.10 neural-guided adapter versus matched lambda 0 text-only adapter, with no DERCo tuning or alternative model search.
    command:
      - .venv/bin/python
      - scripts/tuning/evaluate_derco_e5_transfer_v1.py
      - --data-root
      - data/raw/derco
      - --reliability-summary
      - outputs/derco_eeg_reliability/latest/summary.json
      - --output-dir
      - outputs/derco_e5_transfer_v1/latest
      - --device
      - auto
    approval: manual
    timeout_minutes: 180
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/derco_e5_transfer_v1/latest/summary.json
      - outputs/derco_e5_transfer_v1/latest/participant_results.csv
      - outputs/derco_e5_transfer_v1/latest/participant_article_results.csv
