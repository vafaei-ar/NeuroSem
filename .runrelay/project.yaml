schema_version: 1

project:
  id: neurosem
  repo: vafaei-ar/NeuroSem
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: true
  network_access: true
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: true
  tmux_default: false

tasks:
  run_nmi_bidirectional_fmri_source_calibration_v1:
    description: >-
      Run the frozen source-only multilingual-E5 lambda calibration against the
      previously frozen SMN4Lang fMRI relational targets. This stage must not read
      ZuCo or ChineseEEG and stops at a source-learning gate before external testing.
    command:
      - .venv/bin/python
      - scripts/robustness/run_nmi_bidirectional_fmri_source_calibration_v1.py
    approval: manual
    timeout_minutes: 1440
    requires_gpu: true
    working_directory: .
    artifacts:
      - outputs/nmi_bidirectional_fmri_calibration_v1/latest/summary.json
      - outputs/nmi_bidirectional_fmri_calibration_v1/latest/lambda_*/summary.json
